domain_standard:
  applicable_regime: null
  note: >-
    OneBlinc's market — US consumer cash advance / earned wage access — has no published API domain
    standard in scoring.yml's regime list, and OneBlinc declares none. REWARD-ONLY dimension: recorded as
    not applicable rather than as a failure. The closest adjacent regime is banking_open_finance (FDX,
    FAPI), and OneBlinc participates in that ecosystem only as a CONSUMER of aggregator APIs (Plaid,
    Argyle, StitchCredit, TabaPay all appear in its own Content-Security-Policy allowlist), not as a
    publisher of a conformant contract.
