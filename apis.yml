aid: oneblinc
name: OneBlinc
description: >-
  OneBlinc is a US consumer fintech that provides cash advances, credit-building and financial-wellness
  products to public-sector, healthcare and other essential workers who are underserved by traditional
  banks. Its consumer products are delivered through the OneBlinc / BlincAdvance mobile apps —
  BlincAdvance (paycheck advances from $50 up to $250 on an $8.99/month subscription, with an optional
  paid instant-deposit tier), BlincBoost (a credit-building subscription), BlincShield and BlincEarn — and
  a legacy installment-loan product originated by BlincLoans, Inc. that is not currently accepting new
  applications. Its one business-facing product, BlincFy, sells customer-permissioned income and
  employment verification data and analytics, but is sold through a "Schedule a Demo" sales motion with no
  public developer documentation. OneBlinc publishes no public API, developer portal, SDK or
  machine-readable specification; api.oneblinc.com is a private backend for its own mobile clients.
